name: AshBets Ingest Cron

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:        # manual trigger from GitHub Actions UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger odds ingest + predictions
        run: |
          curl -f -X POST "${{ secrets.ASHBETS_URL }}/api/cron?target=all" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60
